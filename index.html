<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボートレース予想</title>
<style>
  :root { --navy: #1b3c78; --line: #d5dbe5; --bg: #f4f6fa; --red: #c62828; --green: #2e7d32; --muted: #667; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #222; font: 14px/1.6 "Meiryo", "Hiragino Sans", sans-serif; }
  header { background: var(--navy); color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .st { font-size: 12px; opacity: .85; }
  nav { display: flex; gap: 2px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  nav button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font: inherit; color: #333; border-bottom: 3px solid transparent; }
  nav button.on { border-bottom-color: var(--navy); color: var(--navy); font-weight: bold; }
  main { padding: 16px 20px 40px; max-width: 1400px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bar input[type=date], .bar input[type=text] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; }
  .btn { font: inherit; padding: 5px 14px; border-radius: 4px; border: 1px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer; }
  .btn.sub { background: #fff; color: var(--navy); }
  .btn:disabled { opacity: .45; cursor: default; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
  .note { color: var(--muted); font-size: 12px; }
  .err { color: var(--red); }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; min-width: 150px; }
  .kpi b { display: block; font-size: 20px; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .tw { overflow-x: auto; }
  table { border-collapse: collapse; background: #fff; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 3px 6px; white-space: nowrap; text-align: center; }
  th { background: #eef2f8; font-weight: normal; position: sticky; top: 0; }
  tr.buy td { background: #fff3f3; }
  td.l { text-align: left; }
  .ok { color: var(--green); font-weight: bold; }
  .ng { color: #999; }
  td.memo { white-space: normal; text-align: left; min-width: 260px; }
  .g { font-weight: bold; } .g-good { color: var(--green); } .g-bad { color: var(--red); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 3px; background: var(--red); color: #fff; font-weight: bold; }
  pre { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; font: 13px/1.5 "MS Gothic", "Osaka-Mono", monospace; margin: 0 0 12px; }
  #job { display: none; margin: 12px 20px 0; max-width: 1400px; }
  #job.show { display: block; }
  #job pre { max-height: 240px; overflow: auto; margin: 6px 0 0; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--navy); border-right-color: transparent; border-radius: 50%; animation: s 1s linear infinite; vertical-align: middle; }
  @keyframes s { to { transform: rotate(360deg); } }
  .lane { font-weight: bold; display: inline-block; width: 20px; border: 1px solid #999; }
  .l1 { background: #fff; } .l2 { background: #000; color: #fff; } .l3 { background: #e60012; color: #fff; }
  .l4 { background: #0068b7; color: #fff; } .l5 { background: #fff100; } .l6 { background: #00a33e; color: #fff; }
  a { color: var(--navy); }
  /* 場ごとの色 (--h は場ごとの色相) */
  .jo { display: inline-block; min-width: 3.6em; padding: 0 6px; border-radius: 3px; font-weight: bold;
        background: hsl(var(--h) 75% var(--bg, 91%)); border-left: 4px solid hsl(var(--h) 60% var(--bd, 42%)); color: #222; }
  /* 並べ替え・絞り込み */
  th.s { cursor: pointer; user-select: none; -webkit-user-select: none; }
  th.s::after { content: " ↕"; opacity: .25; font-size: 11px; }
  th.s.asc::after { content: " ▲"; opacity: .8; } th.s.desc::after { content: " ▼"; opacity: .8; }
  .filter { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
  .filter .bar { margin-bottom: 6px; }
  .filter .bar:last-child { margin-bottom: 0; }
  .filter select, .filter input[type=search] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips button { font: inherit; font-size: 13px; cursor: pointer; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line);
                  background: hsl(var(--h, 220) 75% var(--bg, 91%)); border-left: 4px solid hsl(var(--h, 220) 60% var(--bd, 42%)); }
  .chips button.all { --h: 220; background: #fff; }
  .chips.some button:not(.on):not(.all) { opacity: .35; }
  .chips button.on { font-weight: bold; box-shadow: 0 0 0 2px hsl(var(--h) 60% 42%); }
  /* まとめ・実績 */
  h2 { font-size: 17px; margin: 18px 0 8px; color: var(--navy); border-bottom: 2px solid var(--navy); padding-bottom: 2px; }
  h2:first-child { margin-top: 0; }
  .kpi.pred { border-top: 3px solid #3b6fd4; } .kpi.past { border-top: 3px solid #1f9a8a; } .kpi.real { border-top: 3px solid #d26a00; }
  .advice { margin: 0; padding-left: 1.3em; } .advice li { margin: 3px 0; }
  .advice li.good::marker { content: "◎ "; color: var(--green); } .advice li.bad::marker { content: "× "; color: var(--red); }
  .advice li.warn::marker { content: "! "; color: #d26a00; font-weight: bold; }
  textarea.memo { width: 100%; min-height: 110px; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 4px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 4px;
                padding: 4px 8px; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); display: none; white-space: nowrap; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .static [data-run], .static .runbar { display: none; }
  @media (max-width: 700px) { main { padding: 12px 10px 30px; } nav { padding: 0 6px; } nav button { padding: 8px 9px; } header { padding: 8px 12px; } }
</style>
</head>
<body>
<header>
  <h1>ボートレース予想</h1>
  <div class="st" id="status">読み込み中…</div>
</header>
<nav id="tabs"></nav>
<div id="job" class="card"></div>
<main id="main"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const {dataset, ...rest} = props;
  const e = Object.assign(document.createElement(tag), rest);
  if (dataset) Object.assign(e.dataset, dataset);
  kids.flat().forEach(k => k != null && e.append(k instanceof Node ? k : String(k)));
  return e;
};
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (d, n) => { const [y, m, dd] = d.split("-").map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); };
const pct = v => v == null || v === "" || isNaN(v) ? "" : (v * 100).toFixed(1) + "%";
const pct0 = v => v == null || v === "" || isNaN(v) ? "" : Math.round(v * 100) + "%";

// サーバー (127.0.0.1) が無いところ (GitHub Pages・iPad) では、毎朝書き出された data/*.json を読むだけ
const STATIC = !["127.0.0.1", "localhost"].includes(location.hostname);
if (STATIC) document.documentElement.classList.add("static");
const hint = t => STATIC ? "。毎朝6時ごろに更新されます" : t;
let racersCache = null;
async function api(path) {
  if (STATIC) return staticApi(path);
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function staticApi(path) {
  const u = new URL(path, "http://x");
  const date = u.searchParams.get("date") || today();
  const get = async (f, what) => {
    const r = await fetch(`data/${f}?t=${Date.now()}`);
    if (!r.ok) throw new Error(`${what}はまだありません`);
    return r.json();
  };
  switch (u.pathname) {
    case "/api/status": return get("status.json", "状態");
    case "/api/job": return {cmd: null};
    case "/api/predictions": return get(`predictions/${date}.json`, `${date} の予想`);
    case "/api/week": return get(`week/${date}.json`, `${date} からの1週間の予想`);
    case "/api/check": return get(`check/${date}.json`, `${date} の答え合わせ`);
    case "/api/totals": return get("totals.json", "答え合わせの記録");
    case "/api/reviews": return get("reviews.json", "振り返り");
    case "/api/advice": return get("advice.json", "アドバイス");
    case "/api/seiseki": return u.searchParams.get("src") === "backtest"
      ? get("seiseki_backtest.json", "過去10年の検証") : get("seiseki.json", "これまでの成績");
    case "/api/racers": {
      racersCache = racersCache || (await get("racers.json", "選手の成績")).rows;
      const q = (u.searchParams.get("q") || "").replace(/[ \u3000]/g, "");
      if (!q) throw new Error("登録番号か名前を入れてください");
      return {rows: racersCache.filter(r => String(r["登録番号"]) === q || String(r["名前"] || "").replace(/[ \u3000]/g, "").includes(q)).slice(0, 30)};
    }
  }
  throw new Error("この画面はパソコンのサーバーでだけ使えます");
}
async function run(cmd, date, extra = {}) {
  const r = await fetch("/api/run", {method: "POST", headers: {"Content-Type": "application/json", "X-Yosou": "1"},
    body: JSON.stringify({cmd, date, ...extra})});
  const j = await r.json();
  if (!r.ok) { alert(j.error); return; }
  pollJob(true);
}

// ---------- 裏で動いている処理 ----------
const JOBNAME = {predict: "予想", week: "1週間の予想", check: "答え合わせ", review: "先週の振り返り",
  train: "学習", update: "データの取り込み", daily: "毎朝の処理", setup: "DBのダウンロード"};
let jobTimer = null, jobWasRunning = false, dismissed = null;
async function pollJob(force) {
  if (STATIC) return;
  let j;
  try { j = await api("/api/job"); } catch { return; }
  const box = $("#job");
  if (!j.cmd || (!j.running && dismissed === j.started)) { box.className = "card"; return; }
  box.className = "card show";
  const name = JOBNAME[j.cmd] || j.cmd;
  const pre = h("pre", {textContent: j.log || "(まだ出力がありません)"});
  if (j.running) {
    box.replaceChildren(h("div", {}, h("span", {className: "spin"}), ` ${name} (${j.date}) を実行中… 開始 ${j.started.slice(11)}`), pre);
    pre.scrollTop = pre.scrollHeight;
  } else {
    box.replaceChildren(h("div", {className: "bar", style: "margin:0"},
      j.error ? h("span", {className: "err"}, `${name}: ${j.error}`) : h("span", {className: "ok"}, `${name} (${j.date}) が終わりました`),
      h("button", {className: "btn sub", textContent: "閉じる", onclick: () => { dismissed = j.started; box.className = "card"; }})),
      h("details", {}, h("summary", {className: "note", textContent: "記録を見る"}), pre));
  }
  document.querySelectorAll("[data-run]").forEach(b => b.disabled = j.running);
  if (j.running) {
    jobWasRunning = true;
    clearTimeout(jobTimer); jobTimer = setTimeout(pollJob, 2000);
  } else if (jobWasRunning) {
    jobWasRunning = false;
    loadStatus(); show(current);  // 終わったら画面を新しくする
  }
}

async function loadStatus() {
  try {
    const s = await api("/api/status");
    if (STATIC) {
      $("#status").textContent = `更新: ${(s.updated || "").replace("T", " ")}　データ: ${s.db_last || "?"} まで　モデル: ${s.trained || "?"} までで学習`;
      return;
    }
    $("#status").textContent = `データ: ${s.db ? (s.db_last || "?") + " まで" : "まだありません"}　` +
      `モデル: ${s.model ? (s.trained || "?") + " までで学習" : "まだありません"}　学習に使う装置: ${s.device === "gpu" ? "GPU" : "CPU"}`;
  } catch (e) { $("#status").textContent = "サーバーに繋がりません"; }
}

// ---------- 場ごとの色 ----------
const JO = ["桐生", "戸田", "江戸川", "平和島", "多摩川", "浜名湖", "蒲郡", "常滑", "津", "三国", "琵琶湖", "住之江",
  "尼崎", "鳴門", "丸亀", "児島", "宮島", "徳山", "下関", "若松", "芦屋", "福岡", "唐津", "大村"];
// 場コード順に色相を回す (隣どうしの場が似た色にならないよう 5つ飛ばし)
// 色相が隣どうし (15度違い) の場は、片方を濃いめにして見分けやすくする
const joHue = name => { const i = JO.indexOf(name); return i < 0 ? 220 : (i * 5 % 24) * 15; };
const joColor = (e, name) => {
  const k = joHue(name) / 15;
  e.style.setProperty("--h", joHue(name));
  e.style.setProperty("--bg", k % 2 ? "82%" : "92%");
  e.style.setProperty("--bd", k % 2 ? "32%" : "48%");
  return e;
};
const jo = name => joColor(h("span", {className: "jo", textContent: name}), name);

// ---------- 表 ----------
// 見出しを押すと並べ替え (押すたびに 小さい順 → 大きい順 → 元の順)。同じ見出しの表はまとめて並べ替える
const sortMem = {}, sortDraws = {};
function sortKey(c, r) {
  if (c[3]) return c[3](r);
  let v = typeof c[1] === "function" ? c[1](r) : r[c[1]];
  if (v instanceof Node) v = v.textContent;
  if (v == null || v === "") return null;
  if (typeof v === "number" || typeof v === "boolean") return +v;
  const n = String(v).replace(/[,%円+\s]/g, "");
  return /^-?\d+(\.\d+)?$/.test(n) ? +n : String(v);
}
function cmp(a, b) {
  if (a == null || b == null) return a == null ? (b == null ? 0 : 1) : -1;
  if (typeof a !== typeof b) return typeof a === "number" ? -1 : 1;
  return typeof a === "number" ? a - b : a.localeCompare(b, "ja");
}
function table(cols, rows, rowClass, key) {
  key = key || cols.map(c => c[0]).join("|");
  const body = h("tbody");
  const ths = cols.map((c, i) => h("th", {className: "s", textContent: c[0], title: "押すと並べ替え", onclick: () => {
    const m = sortMem[key];
    sortMem[key] = !m || m.i !== i ? {i, dir: 1} : m.dir === 1 ? {i, dir: -1} : null;
    sortDraws[key] = sortDraws[key].filter(f => f.el.isConnected || f === draw);
    sortDraws[key].forEach(f => f());
  }}));
  const t = h("table", {}, h("thead", {}, h("tr", {}, ths)), body);
  const draw = () => {
    const m = sortMem[key];
    ths.forEach((th, i) => th.className = "s" + (m && m.i === i ? (m.dir > 0 ? " asc" : " desc") : ""));
    let rs = rows;
    if (m) {
      const k = new Map(rows.map(r => [r, sortKey(cols[m.i], r)]));
      rs = rows.slice().sort((a, b) => {
        const x = k.get(a), y = k.get(b);
        return x == null || y == null ? cmp(x, y) : cmp(x, y) * m.dir;  // 空欄はいつも最後
      });
    }
    body.replaceChildren(...rs.map(r => {
      const tr = h("tr", {className: rowClass ? rowClass(r) : ""});
      cols.forEach(([, f, cls]) => {
        let v = typeof f === "function" ? f(r) : r[f];
        if (f === "場" && v) v = jo(v);
        tr.append(h("td", {className: cls || ""}, v instanceof Node ? v : (v == null ? "" : String(v))));
      });
      return tr;
    }));
  };
  draw.el = t;
  (sortDraws[key] = sortDraws[key] || []).push(draw);
  draw();
  return h("div", {className: "tw"}, t);
}

// 絞り込み: 場 (色つきのボタン)・本命・本命1着確率・判断・買い目・文字 (選手名など)。画面ごとに条件を覚えておく
function filterBar(name, rows, onChange) {
  const f = state.filter[name] = state.filter[name] || {jo: [], lane: "", min: "", hand: "", buy: false, q: ""};
  const has = k => rows.some(r => r[k] != null && r[k] !== "");
  const jos = [...new Set(rows.map(r => r["場"]).filter(Boolean))].sort((a, b) => JO.indexOf(a) - JO.indexOf(b));
  f.jo = f.jo.filter(j => jos.includes(j));
  const chips = h("div", {className: "chips"});
  const count = h("span", {className: "note"});
  const apply = () => {
    chips.classList.toggle("some", f.jo.length > 0);
    chips.querySelectorAll("button[data-jo]").forEach(b => b.classList.toggle("on", f.jo.includes(b.dataset.jo)));
    const q = f.q.replace(/[ 　]/g, "");
    const out = rows.filter(r =>
      (!f.jo.length || f.jo.includes(r["場"])) &&
      (!f.lane || String(r["本命"]) === f.lane) &&
      (!f.min || (+f.min >= 0 ? r["本命1着確率"] >= +f.min : r["本命1着確率"] < -f.min)) &&
      (!f.hand || String(r["判断"] || "").startsWith(f.hand)) &&
      (!f.buy || r["単勝買い目"]) &&
      (!q || Object.values(r).some(v => v != null && String(v).replace(/[ 　]/g, "").includes(q))));
    count.textContent = `${out.length} / ${rows.length} レース`;
    onChange(out);
  };
  chips.append(h("button", {className: "all", textContent: "全部の場", onclick: () => { f.jo = []; apply(); }}),
    ...jos.map(j => {
      const b = h("button", {textContent: j, dataset: {jo: j}, onclick: () => {
        f.jo = f.jo.includes(j) ? f.jo.filter(x => x !== j) : [...f.jo, j]; apply(); }});
      return joColor(b, j);
    }));
  const select = (key, opts) => {
    const e = h("select", {onchange: () => { f[key] = e.value; apply(); }}, opts.map(([v, t]) => h("option", {value: v, textContent: t})));
    e.value = opts.some(o => o[0] === f[key]) ? f[key] : "";
    f[key] = e.value;
    return e;
  };
  const ctl = [];
  if (has("本命")) ctl.push(select("lane", [["", "本命: 全部"], ...[1, 2, 3, 4, 5, 6].map(n => [String(n), `本命 ${n}号艇`])]));
  if (has("本命1着確率")) ctl.push(select("min", [["", "本命1着確率: 全部"], ["0.7", "70%以上 (堅い)"], ["0.5", "50%以上"], ["-0.5", "50%未満"], ["-0.35", "35%未満 (荒れそう)"]]));
  if (has("判断")) {
    const hands = [...new Set(rows.map(r => String(r["判断"] || "").split(":")[0]).filter(Boolean))];
    ctl.push(select("hand", [["", "判断: 全部"], ...hands.map(x => [x, x])]));
  }
  if (rows.length && "単勝買い目" in rows[0]) {
    const cb = h("input", {type: "checkbox", checked: f.buy, onchange: () => { f.buy = cb.checked; apply(); }});
    ctl.push(h("label", {}, cb, " 単勝の買い目があるレースだけ"));
  }
  const q = h("input", {type: "search", placeholder: "選手名・買い目など", value: f.q, oninput: () => { f.q = q.value; apply(); }});
  const el = h("div", {className: "filter"}, h("div", {className: "bar"}, chips), h("div", {className: "bar"}, ...ctl, q, count));
  apply();
  return el;
}
const lane = n => h("span", {className: `lane l${n}`, textContent: n});
const yen = v => (v > 0 ? "+" : "") + Math.round(v).toLocaleString() + "円";
// これまでの答え合わせ (log.csv) の買い方ごとの累計
function kaimeTotals(rows) {
  const pats = [...new Set(rows.flatMap(r => Object.keys(r)).filter(c => c.endsWith(" 投資")).map(c => c.slice(0, -3)))];
  if (!pats.length) return null;
  const sum = pats.map(p => {
    const use = rows.filter(r => r[p + " 投資"] > 0);
    const cost = use.reduce((a, r) => a + +r[p + " 投資"], 0), got = use.reduce((a, r) => a + +r[p + " 払戻"], 0);
    return {name: p, days: use.length, cost, got, bal: got - cost, rate: cost ? got / cost : 0};
  });
  return h("div", {}, h("h3", {textContent: "3連単・3連複 買い方ごとの累計"}),
    h("div", {className: "tw"}, table([["券種・買い方", "name", "l"], ["日数", "days"], ["投資", r => r.cost.toLocaleString() + "円"],
      ["払戻", r => r.got.toLocaleString() + "円"], ["収支", r => h("span", {className: r.bal > 0 ? "ok" : "err", textContent: yen(r.bal)})],
      ["回収率", r => pct(r.rate)]], sum)));
}
// 3連単・3連複を買い方ごとに買っていたらの収支。◎○▲△□ は1着確率の高い順 (analysis/kaime.py)

const SERIES = ["#3b6fd4", "#d26a00", "#1f9a8a"];
function lineChart(xs, series, {max, refs = [], fmt = pct0}) {
  const W = 560, H = 230, L = 40, R = 84, T = 12, B = 26, ns = "http://www.w3.org/2000/svg";
  const sv = (tag, a = {}) => { const e = document.createElementNS(ns, tag); Object.entries(a).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
  const x = i => L + (xs.length < 2 ? 0 : i * (W - L - R) / (xs.length - 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, role: "img"});
  const step = max <= 0.5 ? 0.1 : max <= 1 ? 0.2 : 0.25;
  for (let v = 0; v <= max + 1e-9; v += step) {
    svg.append(sv("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "#e6e9ef"}));
    const t = sv("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "#667"}); t.textContent = fmt(v); svg.append(t);
  }
  refs.forEach(r => {
    svg.append(sv("line", {x1: L, x2: W - R, y1: y(r.v), y2: y(r.v), stroke: "#888", "stroke-dasharray": "4 3"}));
    const t = sv("text", {x: W - R + 4, y: y(r.v) + 4, "font-size": 11, fill: "#555"}); t.textContent = r.label; svg.append(t);
  });
  xs.forEach((v, i) => { if (xs.length <= 12 || i % 2 === 0) {
    const t = sv("text", {x: x(i), y: H - 8, "text-anchor": "middle", "font-size": 11, fill: "#667"}); t.textContent = v; svg.append(t); } });
  const guide = sv("line", {y1: T, y2: H - B, stroke: "#999", visibility: "hidden"});
  svg.append(guide);
  series.forEach((s, k) => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]);
    svg.append(sv("polyline", {points: pts.filter(Boolean).map(p => p.join(",")).join(" "), fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round"}));
    pts.forEach(p => p && svg.append(sv("circle", {cx: p[0], cy: p[1], r: 4, fill: s.color, stroke: "#fff", "stroke-width": 2})));
    const last = pts.filter(Boolean).pop();
    if (last && refs.every(r => Math.abs(y(r.v) - last[1]) > 10)) {
      const t = sv("text", {x: last[0] + 8, y: last[1] + 4, "font-size": 11, fill: "#333"}); t.textContent = s.short || s.name; svg.append(t);
    }
  });
  const tip = h("div", {className: "tip"});
  const box = h("div", {className: "chart"}, svg, tip);
  xs.forEach((v, i) => {
    const half = (W - L - R) / Math.max(xs.length - 1, 1) / 2;
    const hit = sv("rect", {x: x(i) - half, y: 0, width: half * 2, height: H, fill: "transparent"});
    const on = () => {
      guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i)); guide.setAttribute("visibility", "visible");
      tip.replaceChildren(h("b", {textContent: v}), ...series.map(s => h("div", {}, h("span", {style: `color:${s.color}`, textContent: "● "}), `${s.name}: ${s.values[i] == null ? "-" : pct(s.values[i])}`)));
      tip.style.display = "block";
      const px = x(i) / W * box.clientWidth;
      tip.style.left = Math.min(px + 10, box.clientWidth - tip.offsetWidth - 4) + "px"; tip.style.top = "6px";
    };
    hit.addEventListener("pointerenter", on); hit.addEventListener("pointerdown", on);
    hit.addEventListener("pointerleave", () => { tip.style.display = "none"; guide.setAttribute("visibility", "hidden"); });
    svg.append(hit);
  });
  return h("div", {}, h("div", {className: "legend"}, series.map(s => h("span", {}, h("i", {style: `background:${s.color}`}), s.name))), box);
}

// 今日からの1週間の予想 (今日の分が無ければ一番新しいもの)。無ければ今日の予想だけ
async function loadWeek() {
  let st = {};
  try { st = await api("/api/status"); } catch {}
  const t = today();
  const ds = [t, ...((st.dates || {}).week || []).filter(d => d < t).sort().reverse()];
  for (const d of ds) {
    try {
      const j = await api(`/api/week?date=${d}`);
      const rows = j.rows.filter(r => r["日付"] >= t);
      if (rows.length) return {from: t, rows};
    } catch {}
  }
  try { return {from: t, rows: (await api(`/api/predictions?date=${t}`)).rows.map(r => ({"日付": t, ...r}))}; } catch { return null; }
}

// まとめに書く「考慮する点」を、過去の検証・実際の成績・今週の予想から作る
function autoTips(rows, bt, real) {
  const tips = [];
  const btRows = bt ? (bt.periods["直近1年"] || bt.periods["全期間"]).rows : [];
  btRows.filter(r => r["区分"] !== "当たり方" && r["評価"] === "◎").forEach(r =>
    tips.push(["good", `${r["区分"]} ${r["項目"]}: 過去の検証 (直近1年) で回収率 ${pct(r["回収率"])}、的中率 ${pct0(r["的中率"])}。今週もこれが中心。`]));
  const san = btRows.filter(r => ["3連単", "3連複"].includes(r["区分"]) && r["回収率"] != null).sort((a, b) => b["回収率"] - a["回収率"]);
  if (san.length && san[0]["回収率"] < 1)
    tips.push(["warn", `3連単・3連複はどの買い方も回収率100%未満 (一番良い ${san[0]["区分"]} ${san[0]["項目"]} で ${pct(san[0]["回収率"])})。買うなら少額で、堅いレースに絞る。`]);
  const bad = btRows.filter(r => r["区分"] !== "当たり方" && r["評価"] === "×").map(r => `${r["区分"]} ${r["項目"]} (${pct(r["回収率"])})`);
  if (bad.length) tips.push(["bad", `やめたほうがいい買い方: ${bad.join("、")}。でたらめに買う (約75%) より悪い。`]);
  if (real) {
    const p = real.periods["直近30日"] || real.periods["全期間"];
    const tan = p.rows.find(r => r["区分"] === "単勝");
    const btTan = btRows.find(r => r["区分"] === "単勝");
    if (tan && btTan && tan["回収率"] != null) {
      const few = (tan["的中"] || 0) < 10 ? " まだ的中が少ないので、1回の配当で大きく変わります。" : "";
      tips.push([tan["回収率"] >= 1 ? "good" : "warn", `実際の単勝の買い目 (${p.from}〜${p.to}) は ${tan["点数"]}点で回収率 ${pct(tan["回収率"])}、検証は ${pct(btTan["回収率"])}。${few}`]);
    }
  }
  if (rows.length) {
    const hard = rows.filter(r => r["本命1着確率"] >= 0.7).length, rough = rows.filter(r => r["本命1着確率"] < 0.35).length;
    tips.push(["", `堅いレース (本命1着確率70%以上) は ${hard}R。本命が3着以内に来るのは過去の検証で約84%なので、3連複の軸にしやすい。`]);
    if (rough) tips.push(["warn", `荒れそうなレース (本命1着確率35%未満) は ${rough}R。予想が当たりにくいので、見送るか少額に。`]);
    const byJo = {};
    rows.filter(r => r["単勝買い目"]).forEach(r => byJo[r["場"]] = (byJo[r["場"]] || 0) + 1);
    const top = Object.entries(byJo).sort((a, b) => b[1] - a[1]).slice(0, 3);
    if (top.length) tips.push(["", `単勝の買い目が多い場: ${top.map(([j, n]) => `${j} ${n}点`).join("、")}。`]);
  }
  tips.push(["warn", "予想は前日までの情報で作っています。展示タイム・風・波・実際のオッズは「直前情報」で確かめてから買う。オッズが予想より下がっていたら期待値1を割るので見送る。"]);
  tips.push(["warn", "払戻率は約75%。1日の予算を決め、負けを取り返そうと点数を増やさない。"]);
  return h("ul", {className: "advice"}, tips.map(([c, t]) => h("li", {className: c, textContent: t})));
}

function adviceText(text) {

}

        h("div", {className: "note", textContent: "このページは GitHub Actions が毎朝6時ごろに自動で更新します (成績の取り込み → 昨日の答え合わせ → 月曜は先週の振り返り → 7日ごとに学習し直し → 今日と明日の予想)。展示タイム・実際のオッズでの直前のおすすめは、パソコンのサーバーと Chrome 拡張機能でだけ見られます。"})));
      return;
    }
    const row = (label, cmd, note) => h("div", {className: "card"},
      h("div", {className: "bar"}, h("button", {className: "btn", textContent: label, dataset: {run: 1}, onclick: () => run(cmd, today())}),
        h("span", {className: "note", textContent: note})));
    el.append(
      h("div", {className: "card"},
        h("div", {}, `データ (DB): ${s.db ? (s.db_last || "?") + " の成績まで" : "まだありません"}`),
        h("div", {}, `予想モデル: ${s.model ? (s.trained || "?") + " のデータまでで学習" : "まだありません"}` +
          `${s.late_model ? " (直前情報のモデルあり)" : ""}`),
        h("div", {}, `学習に使う装置: ${s.device === "gpu" ? "GPU" : "CPU"}`),
        h("div", {className: "note", textContent: "GPU は LightGBM の OpenCL 版で使います (NVIDIA・AMD・Intel のグラフィックドライバーが入っていれば自動)。使えないときは CPU の全コアで学習します。"})),
      row("データを取り込む", "update", "DB の最終日の翌日〜昨日の成績と番組表を公式サイトから取り込みます (数分)"),
      row("学習し直す", "train", "直近2年のデータで予想モデルを作り直します (40分〜1時間半。GPU があれば短くなります)"),
      row("毎朝の処理を今すぐ", "daily", "取り込み → 昨日の答え合わせ → (月曜は振り返り) → 7日ごとに学習し直し"),
      s.db ? "" : row("DB をダウンロード", "setup", "GitHub の Release から過去の成績 (約1.1GB) を取得します"));
  }},
};

const state = {filter: {}};
let current = "matome";
function show(name) {
  current = name;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.page === name));
  const el = $("#main");
  el.replaceChildren();
  PAGES[name].render(el).then(() => pollJob());
  try { localStorage.setItem("page", name); } catch {}
}
$("#tabs").append(...Object.entries(PAGES).map(([k, p]) =>
  h("button", {textContent: p.title, dataset: {page: k}, onclick: () => show(k)})));
let first = "matome";
try { first = localStorage.getItem("page") || "matome"; } catch {}
loadStatus();
show(PAGES[first] ? first : "matome");
</script>
</body>
</html>
