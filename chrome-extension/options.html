<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ボートレース予想 設定</title>
<style>
body { font: 14px/1.6 "Meiryo", "Hiragino Sans", sans-serif; color: #222; background: #f4f6fa; margin: 0; }
main { max-width: 560px; margin: 24px auto; background: #fff; border: 1px solid #c9d3e3; border-radius: 8px; padding: 20px 24px; }
h1 { font-size: 20px; color: #1b3c78; margin: 0 0 12px; }
h2 { font-size: 15px; color: #1b3c78; border-bottom: 1px solid #dde4ef; padding-bottom: 4px; margin: 20px 0 8px; }
label { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
label span { width: 170px; flex: none; }
input[type=text], input[type=password], input[type=number] { flex: 1; padding: 6px 8px; border: 1px solid #9aa9c2; border-radius: 4px; font: inherit; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
button, a.btn { padding: 8px 16px; border: 0; border-radius: 4px; background: #1b3c78; color: #fff; font: inherit; cursor: pointer; text-decoration: none; }
button.sub, a.sub { background: #e6ebf3; color: #1b3c78; }
button.danger { background: #fff; color: #c00; border: 1px solid #c00; }
#msg { margin-top: 10px; color: #1b6b2a; min-height: 1.6em; }
.note { color: #666; font-size: 12px; }
</style></head>
<body><main>
<h1>ボートレース予想 設定</h1>
<div class="row">
  <a class="btn" href="https://ib.mbrace.or.jp/" target="_blank">テレボートを開く（自動ログイン）</a>
  <a class="btn sub" href="http://127.0.0.1:8765/" target="_blank" title="パソコンの予想サーバーを起動しているときだけ開けます">予想の操作画面</a>
</div>

<h2>テレボートのログイン情報</h2>
<label><span>加入者番号</span><input id="memberNo" type="text" inputmode="numeric" autocomplete="off" maxlength="10"></label>
<label><span>暗証番号</span><input id="pin" type="password" autocomplete="off" maxlength="10"></label>
<label><span>認証用パスワード</span><input id="authPassword" type="password" autocomplete="off" maxlength="10"></label>
<label><span>投票用パスワード（入金・購入用）</span><input id="betPassword" type="password" autocomplete="off" maxlength="10"></label>
<p class="note">空のままの欄は、前に保存した値を変えません。保存先はこのブラウザの中だけです。</p>

<h2>買い方</h2>
<label><span>全自動（入金・購入まで）</span><input id="auto" type="checkbox"></label>
<label><span>1点の金額（円）</span><input id="stake" type="number" min="100" step="100"></label>
<label><span>1日の上限（円）</span><input id="cap" type="number" min="100" step="100"></label>

<div class="row">
  <button id="save">保存</button>
  <button id="clear" class="danger">ログイン情報を全部消す</button>
</div>
<div id="msg"></div>
<p class="note" id="status"></p>
</main>
<script src="options.js"></script>
</body></html>
