name: probe-more
# 追加データの調査用: 公式サイトなどのページを数枚だけ取って probe/out/ に置く (1秒に1回)。
on:
  push:
    branches: [claude/project-thread-0z3396]
    paths: [probe/urls.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sL -m 60 -A "Mozilla/5.0 (personal research; low-rate)" -o "probe/out/$name" -w "$name %{http_code} %{size_download}\n" "$url" | tee -a probe/out/_status.txt
            sleep 1
          done < probe/urls.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add probe/out && git commit -m "probe: 結果" && git push
