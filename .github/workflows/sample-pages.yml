name: sample-pages
# 公式サイト (boatrace.jp) のページ構成を確認するため、数ページだけ取得して artifact に保存する (解析用・一時的)
on:
  push:
    branches: [claude/project-thread-o4gk97]
    paths: [.github/sample-pages.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir pages
          while read -r name url; do
            case "$name" in ""|"#"*) continue;; esac
            curl -s -A "Mozilla/5.0 (personal research)" -m 30 -o "pages/$name.html" "$url" || true; echo "$name $? $(wc -c < pages/$name.html)"
            sleep 2
          done < .github/sample-pages.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf pages.tgz pages
          gh release create "pages-$(date +%s)" pages.tgz --title "sample pages" --notes "page structure sample" --prerelease --target ${{ github.sha }}
