name: grab-results
# 一時的: 当日の結果ページ (boatrace.jp raceresult) をまとめて取得して prerelease に置く (パーサー開発用)
on:
  push:
    branches: [claude/project-thread-cvy7io]
    paths: [.github/workflows/grab-results.yml]
permissions:
  contents: write
env:
  TZ: Asia/Tokyo
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date +%Y%m%d)
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          mkdir -p pages
          for u in "pay?hd=$D" "raceresult?rno=1&jcd=23&hd=$D" "raceresult?rno=2&jcd=10&hd=$D"; do
            curl -s -m 30 -A "Mozilla/5.0 (personal research; low-rate)" -o "pages/probe_${u%%\?*}_$RANDOM.html" -w "$u %{http_code} %{size_download} %{time_total}\n" "https://www.boatrace.jp/owpc/pc/race/$u" >> pages/status.txt || echo "$u fail $?" >> pages/status.txt
            sleep 1
          done
          tar czf probe.tgz pages
          gh release create "results-probe-$(date +%s)" probe.tgz --repo ${{ github.repository }} --title "results probe" --notes-file pages/status.txt --prerelease
          tail -n +2 site/history/$D.csv | cut -d, -f1 | while read rid; do
            j=${rid:9:2}; r=$((10#${rid:12:2}))
            curl -s -m 30 -A "Mozilla/5.0 (personal research; low-rate)" -m 15 -o pages/$rid.html "https://www.boatrace.jp/owpc/pc/race/raceresult?rno=$r&jcd=$j&hd=$D"
            sleep 1
          done
          tar czf pages.tgz pages
          ls pages | wc -l
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "results-$(date +%s)" pages.tgz --repo ${{ github.repository }} --title "results $(date +%F_%H%M)" --notes "raceresult pages" --prerelease
