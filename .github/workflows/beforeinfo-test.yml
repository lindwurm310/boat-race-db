name: beforeinfo-test
# 一時的な動作確認 (過去の直前情報が取れるか)。確認が済んだら消す。
on:
  push:
    branches: [claude/project-thread-o4gk97]
    paths: [analysis/beforeinfo.py, .github/workflows/beforeinfo-test.yml]
env:
  TZ: Asia/Tokyo
  PYTHONUTF8: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: boatrace.sqlite
          key: db-none
          restore-keys: db-
      - run: if [ ! -s boatrace.sqlite ]; then python analysis/yosou.py setup; fi
      - name: 同時に待つ版で1日まるごと + さかのぼり
        run: |
          time python analysis/beforeinfo.py --date 2026-10-26
          time python analysis/beforeinfo.py --backfill-minutes 5 --until 2026-10-01
          ls -la predictions/beforeinfo
