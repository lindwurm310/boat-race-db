name: yosou-page
# 毎朝 6:00 (日本時間) に予想・答え合わせ・振り返りを作り、GitHub Pages (gh-pages ブランチ) に置く。
# iPad などからサーバーなしで見るため。Settings → Pages → Source を「Deploy from a branch」「gh-pages」にしておく。
on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = 日本時間 6:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yosou-page
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  PYTHONUTF8: "1"

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: checkout gh-pages (これまでの予想と答え合わせ)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site && git -C site init -b gh-pages && git -C site remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          mkdir -p predictions site/history
          cp -r site/history/. predictions/ || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: restore DB
        uses: actions/cache@v4
        with:
          path: boatrace.sqlite
          key: db-${{ github.run_id }}
          restore-keys: db-
      - name: restore model
        uses: actions/cache@v4
        with:
          path: model
          key: model-${{ github.run_id }}
          restore-keys: model-

      - name: DB (無ければ Release から取得)
        run: |
          if [ ! -s boatrace.sqlite ]; then python analysis/yosou.py setup; fi

      - name: 取り込み・昨日の答え合わせ・(月曜は)先週の振り返り
        # モデルが無いときだけここで学習する。7日ごとの学習し直しはページを出したあとにする
        run: |
          if [ -f model/win.txt ]; then R=100000; else R=0; fi
          python analysis/yosou.py daily --retrain-days $R

      - name: 今日から1週間 (番組表が出ている日) の予想
        # 前の日の 16:00 (note-daily) に Note 記事で出した今日の予想があれば、そのレースはその予想を残す
        # (記事の買い目と答え合わせの買い目を同じにするため)。記事のあとに番組表が出た場は朝の予想を足す
        run: |
          T=$(date +%Y%m%d)
          if [ -f "predictions/$T.csv" ]; then cp "predictions/$T.csv" "$RUNNER_TEMP/note.csv"; fi
          python analysis/yosou.py week || true
          if [ -f "$RUNNER_TEMP/note.csv" ] && [ -f "predictions/$T.csv" ]; then
            python - "$RUNNER_TEMP/note.csv" "predictions/$T.csv" <<'PY'
          import sys, pandas as pd
          note, morning = (pd.read_csv(p, encoding="utf-8-sig", dtype=str) for p in sys.argv[1:])
          add = morning[~morning["race_id"].isin(note["race_id"])]
          out = pd.concat([note, add]).sort_values(["締切", "場"])
          out.to_csv(sys.argv[2], index=False, encoding="utf-8-sig")
          print(f"今日の予想: 記事に出した {len(note)} レース + 朝に足した {len(add)} レース")
          PY
          fi

      - name: ページを作る
        run: |
          python analysis/site.py --out site
          find predictions -maxdepth 1 \( -name '*.csv' -o -name '*.txt' \) -exec cp {} site/history/ \;
          touch site/.nojekyll

      - name: gh-pages に置く
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "予想 $(date +%F)" || echo "変更なし"
          git push origin gh-pages

      - name: 7日ごとに学習し直す (次の日の予想から使う)
        run: |
          AGE=$(python - <<'PY'
          import datetime as dt, json, os, sys
          sys.path.insert(0, "analysis")
          import yosou
          p = "model/trained.json"
          if not os.path.exists(p):
              print(999)
          else:
              end = json.load(open(p, encoding="utf-8"))["data_end"]
              print((dt.date.fromisoformat(yosou.last_date("boatrace.sqlite")) - dt.date.fromisoformat(end)).days)
          PY
          )
          echo "前回の学習から ${AGE} 日"
          if [ "$AGE" -ge 7 ]; then python analysis/yosou.py train; fi
